name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # @vscode/vsce 4.x requires Node >= 22. Note this is the BUILD
          # runtime; the emitted bundle targets node18, which is what
          # VS Code 1.85 (engines.vscode) actually ships.
          node-version: 22
          cache: npm

      - run: npm ci

      # esbuild strips types without checking them - only syntax errors
      # surface from the build. This is the only thing that type-checks.
      - run: npm run check-types

      - run: npm run lint

      - run: npm run test:unit

      - run: npm run compile

      # Integration tests drive a real VS Code; headless Linux needs xvfb.
      # VS Code is Electron: on ubuntu-24.04 runners the image no longer ships
      # several libraries it dlopen()s at startup, so `xvfb-run npm test` dies
      # before a single test runs. xvfb alone is not enough.
      - name: System libraries VS Code needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libgtk-3-0t64 libpango-1.0-0 libcairo2
      - run: xvfb-run -a npm test

      # Fail loudly here rather than at publish time if dist/ was excluded
      # by .vscodeignore ("Extension entrypoint(s) missing").
      - run: npx --yes @vscode/vsce@4 ls --tree --no-dependencies
