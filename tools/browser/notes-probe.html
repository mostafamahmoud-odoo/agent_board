<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="webview.css">
<style>html,body{margin:0;height:100%;background:#1e1e1e}#app{position:relative;height:100%}</style>
</head><body data-vscode-theme-kind="vscode-dark" class="vscode-dark" data-mermaid-uri="mermaid.min.js">
<div id="app"></div>
<script nonce="n">window.__posted=[];let st;
window.acquireVsCodeApi=()=>({postMessage:m=>window.__posted.push(m),getState:()=>st,setState:s=>(st=s)});</script>
<script type="module" nonce="n" src="webview.js"></script>
<script nonce="n">
window.addEventListener('load',()=>setTimeout(()=>{
  window.dispatchEvent(new MessageEvent('message',{data:{type:'render',generation:1,spec:{
    title:'notes and tools', frames:[{id:'f',title:'a group',nodes:['a','b']}],
    nodes:[{id:'a',label:'a node',kind:'base'},{id:'b',label:'another',kind:'fix',sub:'with a sub line'}],
    edges:[{from:'a',to:'b',label:'link'}]}}}));
  setTimeout(()=>{
    window.dispatchEvent(new MessageEvent('message',{data:{type:'feedbackState',data:{
      answers:[],drawings:[],moves:[],
      stickies:[
        {id:'s-1',at:new Date().toISOString(),x:40,y:30,text:'a sticky note that should read like paper',boardTitle:'notes and tools'},
        {id:'s-2',at:new Date().toISOString(),x:280,y:150,text:'second note',boardTitle:'notes and tools'}
      ]}}}));
  },250);
},80));
</script></body></html>
