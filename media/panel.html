<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; script-src {{cspSource}} 'unsafe-inline';" />
<style>
  :root { color-scheme: dark light; }
  html, body { height: 100%; }
  body {
    font-family: var(--vscode-font-family, sans-serif);
    color: var(--vscode-foreground);
    background: var(--vscode-editor-background);
    margin: 0; padding: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--vscode-panel-border, #ffffff1f);
    flex: 0 0 auto;
  }
  #note-title { font-size: 1.05em; font-weight: 600; margin-right: auto;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar button {
    background: var(--vscode-button-secondaryBackground, #ffffff14);
    color: var(--vscode-button-secondaryForeground, inherit);
    border: 1px solid var(--vscode-panel-border, #ffffff26);
    border-radius: 4px; padding: 2px 8px; cursor: pointer;
    font-family: inherit; font-size: 12px; line-height: 18px;
  }
  #bar button:hover { background: var(--vscode-button-secondaryHoverBackground, #ffffff26); }
  #bar button.active { background: var(--vscode-button-background); color: var(--vscode-button-foreground, #fff); border-color: transparent; }
  #zoomlabel { font-size: 11px; opacity: .6; min-width: 38px; text-align: right; }
  #modehint {
    font-size: 11px; opacity: 0; transition: opacity .15s;
    color: var(--vscode-charts-orange, #e8a33d); white-space: nowrap;
  }
  #modehint.show { opacity: .95; }
  #canvas {
    position: relative; flex: 1 1 auto; overflow: hidden;
    cursor: grab; touch-action: none;
  }
  #canvas.dragging { cursor: grabbing; }
  #canvas.pen-mode, #canvas.note-mode { cursor: crosshair; }
  #viewport { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #board-content svg { display: block; }
  #overlay { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  #empty { padding: 24px; opacity: .6; font-style: italic; }
  #err { padding: 16px; color: var(--vscode-errorForeground, #f88); white-space: pre-wrap; }
  .ink { font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive, sans-serif; }

  .sticky-note {
    width: 170px; min-height: 80px; box-sizing: border-box;
    background: #fff3a0; color: #3a2f00; border-radius: 2px;
    box-shadow: 2px 3px 8px rgba(0,0,0,.35); padding: 8px;
    font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive, sans-serif;
    font-size: 13px; transform: rotate(-1.1deg);
  }
  .sticky-note textarea {
    width: 100%; height: 64px; border: none; background: transparent; resize: none; outline: none;
    font: inherit; color: inherit;
  }
  .sticky-note .sticky-text { white-space: pre-wrap; word-break: break-word; }

  #qbtn { display: none; }
  #qpanel {
    position: absolute; right: 12px; bottom: 12px; width: 300px; max-height: 65%;
    overflow: auto; display: none;
    background: var(--vscode-editorWidget-background, #252526);
    border: 1px solid var(--vscode-panel-border, #ffffff26);
    border-radius: 6px; padding: 10px; z-index: 5;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    font-family: var(--vscode-font-family, sans-serif);
  }
  #qpanel.open { display: block; }
  #qpanel h4 { margin: 0 0 8px; font-size: 12px; opacity: .75; text-transform: uppercase; letter-spacing: .04em; }
  .qitem { margin-bottom: 12px; }
  .qitem .qtext { font-size: 13px; margin-bottom: 5px; }
  .qitem textarea {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 12px; resize: vertical; min-height: 42px;
    background: var(--vscode-input-background); color: var(--vscode-input-foreground);
    border: 1px solid var(--vscode-input-border, #ffffff26); border-radius: 4px; padding: 5px;
  }
  .qitem button {
    margin-top: 5px; background: var(--vscode-button-background); color: var(--vscode-button-foreground, #fff);
    border: none; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .qitem.answered { opacity: .55; }
  .qitem.answered textarea, .qitem.answered button { display: none; }
  .qitem .answered-badge { font-size: 11px; color: var(--vscode-charts-green, #5ddc8c); }

  #bar button:disabled { opacity: .35; cursor: not-allowed; }

  #librarypanel {
    position: absolute; right: 12px; top: 12px; width: 300px; max-height: 60%;
    overflow: auto; display: none;
    background: var(--vscode-editorWidget-background, #252526);
    border: 1px solid var(--vscode-panel-border, #ffffff26);
    border-radius: 6px; padding: 10px; z-index: 5;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    font-family: var(--vscode-font-family, sans-serif);
  }
  #librarypanel.open { display: block; }
  #librarypanel h4 { margin: 0 0 8px; font-size: 12px; opacity: .75; text-transform: uppercase; letter-spacing: .04em; }
  #librarypanel .libempty { font-size: 12px; opacity: .6; }
  .libitem { padding: 6px 0; border-bottom: 1px solid var(--vscode-panel-border, #ffffff1a); }
  .libitem:last-child { border-bottom: none; }
  .libitem .libtitle { font-size: 13px; margin-bottom: 2px; }
  .libitem .libdate { font-size: 11px; opacity: .55; margin-bottom: 4px; }
  .libitem .libactions button {
    font-size: 11px; padding: 2px 7px; margin-right: 4px;
    background: var(--vscode-button-secondaryBackground, #ffffff14);
    color: var(--vscode-button-secondaryForeground, inherit);
    border: 1px solid var(--vscode-panel-border, #ffffff26);
    border-radius: 4px; cursor: pointer; font-family: inherit;
  }

  #viewbanner {
    position: absolute; left: 12px; top: 12px; z-index: 5;
    background: var(--vscode-editorWidget-background, #252526);
    border: 1px solid var(--vscode-panel-border, #ffffff26); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; display: none; align-items: center; gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    font-family: var(--vscode-font-family, sans-serif);
  }
  #viewbanner.show { display: flex; }
  #viewbanner button {
    font-size: 11px; padding: 2px 8px; cursor: pointer; font-family: inherit;
    background: var(--vscode-button-background); color: var(--vscode-button-foreground, #fff);
    border: none; border-radius: 4px;
  }
</style>
</head>
<body>
  <div id="bar">
    <div id="note-title">Claude Notes</div>
    <button id="qbtn" title="Answer Claude's questions">Questions</button>
    <button id="pen" title="Pen: draw on the board"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:3px"><path d="M11.3 1.6l3.1 3.1-8.6 8.6H2.7v-3.1l8.6-8.6z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M9.3 3.6l3.1 3.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Pen</button>
    <button id="note" title="Sticky note: click the board to drop a note"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:3px"><path d="M2.5 2.5h7.6l3.4 3.4v7.6h-11v-11z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M10.1 2.5v3.4h3.4" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>Note</button>
    <button id="clearmarks" title="Clear your answers, drawings and stickies">Clear marks</button>
    <button id="savebtn" title="Save this board to your project's note library">Save</button>
    <button id="librarybtn" title="Browse saved notes">Library</button>
    <span id="modehint"></span>
    <button id="fit" title="Fit to panel">Fit</button>
    <button id="zout" title="Zoom out">&minus;</button>
    <button id="zin" title="Zoom in">+</button>
    <button id="reset" title="Actual size">1:1</button>
    <span id="zoomlabel">100%</span>
  </div>
  <div id="canvas">
    <div id="viewport">
      <div id="board-content"></div>
      <svg id="overlay" width="6000" height="6000" overflow="visible"></svg>
    </div>
    <div id="empty">No notes yet. Ask Claude to sketch out the plan.</div>
    <div id="viewbanner"></div>
    <div id="qpanel"></div>
    <div id="librarypanel"></div>
  </div>

  <script src="{{mermaidUri}}"></script>
  <script src="{{roughUri}}"></script>
  <script>
  (function () {
    const vscode = acquireVsCodeApi();
    const canvas = document.getElementById('canvas');
    const viewport = document.getElementById('viewport');
    const boardContent = document.getElementById('board-content');
    const overlay = document.getElementById('overlay');
    const emptyEl = document.getElementById('empty');
    const titleEl = document.getElementById('note-title');
    const zoomLabel = document.getElementById('zoomlabel');
    const penBtn = document.getElementById('pen');
    const noteBtn = document.getElementById('note');
    const clearMarksBtn = document.getElementById('clearmarks');
    const qBtn = document.getElementById('qbtn');
    const qPanel = document.getElementById('qpanel');
    const saveBtn = document.getElementById('savebtn');
    const libraryBtn = document.getElementById('librarybtn');
    const libraryPanel = document.getElementById('librarypanel');
    const viewBanner = document.getElementById('viewbanner');
    const modeHint = document.getElementById('modehint');

    const SVG_NS = 'http://www.w3.org/2000/svg';

    /* ---------------------------------------------------------------- theme */

    function isDarkBg() {
      const c = getComputedStyle(document.body).backgroundColor || 'rgb(30,30,30)';
      const m = c.match(/\d+/g);
      if (!m) return true;
      const [r, g, b] = m.map(Number);
      return (0.299 * r + 0.587 * g + 0.114 * b) < 128;
    }

    const THEMES = {
      dark: {
        ink: '#e6edf6', frameStroke: '#66748a', frameFill: '#ffffff08', frameTitle: '#9fb3c8',
        edge: '#aab7c8', chip: '#1e1e1e',
        kinds: {
          base:    { s: '#7aa2d2', f: '#7aa2d226', t: '#e9f2ff' },
          problem: { s: '#ff8080', f: '#ff808026', t: '#ffe8e8' },
          fix:     { s: '#5ddc8c', f: '#5ddc8c26', t: '#e7fff0' },
          data:    { s: '#e8c46a', f: '#e8c46a26', t: '#fff7e4' },
          accent:  { s: '#c39bff', f: '#c39bff26', t: '#f4edff' },
          note:    { s: '#e8c46a', f: '#e8c46a33', t: '#fff9ea' },
          muted:   { s: '#8a94a6', f: '#8a94a61a', t: '#cbd3de' }
        }
      },
      light: {
        ink: '#1f2933', frameStroke: '#8b98a8', frameFill: '#00000008', frameTitle: '#5b6b7c',
        edge: '#5b6b7c', chip: '#ffffff',
        kinds: {
          base:    { s: '#2f6fb0', f: '#2f6fb01f', t: '#12314f' },
          problem: { s: '#c0392b', f: '#c0392b1f', t: '#5a1a13' },
          fix:     { s: '#1e8f4e', f: '#1e8f4e1f', t: '#0d3d22' },
          data:    { s: '#b8860b', f: '#b8860b1f', t: '#4d3805' },
          accent:  { s: '#7b3fd4', f: '#7b3fd41f', t: '#34175e' },
          note:    { s: '#b8860b', f: '#f5e6b8', t: '#4d3805' },
          muted:   { s: '#6b7480', f: '#6b74801a', t: '#39414a' }
        }
      }
    };
    let TH = THEMES[isDarkBg() ? 'dark' : 'light'];
    function kindOf(k) { return TH.kinds[k] || TH.kinds.base; }

    /* --------------------------------------------------------- text metrics */

    const FS_LABEL = 15, LH_LABEL = 19;
    const FS_SUB = 12, LH_SUB = 15;
    const FS_TITLE = 13, FS_EDGE = 12, FS_NOTE = 14;
    const PAD_X = 14, PAD_Y = 12;

    // One shared canvas 2d context gives real advance widths, so boxes are sized
    // to the text that will actually be painted instead of a per-char guess.
    const meas = document.createElement('canvas').getContext('2d');
    const INK_FONT = "'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive, sans-serif";
    function textW(str, size, bold) {
      meas.font = (bold ? 'bold ' : '') + size + "px " + INK_FONT;
      return meas.measureText(str).width;
    }

    function wrap(text, maxW, size) {
      const out = [];
      String(text == null ? '' : text).split('\n').forEach((para) => {
        const words = para.split(/\s+/).filter(Boolean);
        if (!words.length) { out.push(''); return; }
        let line = '';
        words.forEach((word) => {
          while (textW(word, size) > maxW) {          // word alone too wide: hard split
            let cut = word.length - 1;
            while (cut > 1 && textW(word.slice(0, cut), size) > maxW) cut--;
            if (line) { out.push(line); line = ''; }
            out.push(word.slice(0, cut));
            word = word.slice(cut);
          }
          const probe = line ? line + ' ' + word : word;
          if (textW(probe, size) <= maxW) line = probe;
          else { if (line) out.push(line); line = word; }
        });
        if (line) out.push(line);
      });
      return out.length ? out : [''];
    }

    /* ----------------------------------------------------------- svg helpers */

    function svgText(parent, str, x, y, opt) {
      const t = document.createElementNS(SVG_NS, 'text');
      t.setAttribute('x', x); t.setAttribute('y', y);
      t.setAttribute('class', 'ink');
      t.setAttribute('font-size', opt.size);
      t.setAttribute('fill', opt.fill);
      t.setAttribute('text-anchor', opt.anchor || 'middle');
      if (opt.bold) t.setAttribute('font-weight', '600');
      if (opt.opacity != null) t.setAttribute('opacity', opt.opacity);
      if (opt.rotate) t.setAttribute('transform', 'rotate(' + opt.rotate + ' ' + x + ' ' + y + ')');
      t.textContent = str;
      parent.appendChild(t);
      return t;
    }

    function svgLines(parent, lines, cx, firstBaseline, lh, opt) {
      lines.forEach((ln, i) => svgText(parent, ln, cx, firstBaseline + i * lh, opt));
    }

    // Stable seed per element id: rough.js then redraws the same wobble on every
    // re-render, so a spec edit does not reshuffle the whole board.
    function seedOf(str) {
      let h = 2166136261;
      for (let i = 0; i < String(str).length; i++) {
        h ^= String(str).charCodeAt(i); h = Math.imul(h, 16777619);
      }
      return Math.abs(h) % 100000;
    }

    /* -------------------------------------------------------------- measure */

    const DEFAULT_NODE_W = 270;
    const NODE_GAP = 20, FRAME_PAD = 16, FRAME_TITLE_H = 30, FRAME_GAP = 34;
    const CELL_H = 26, HEAD_H = 30, CELL_PAD = 10, FS_CELL = 12;
    const SCR_PAD = 16, FS_SCR = 12, FIELD_H = 24;

    function measureNode(n, wHint) {
      const w = n.w || wHint || DEFAULT_NODE_W;
      const inner = w - 2 * PAD_X;
      const lines = wrap(n.label != null ? n.label : n.id, inner, FS_LABEL);
      const subLines = n.sub ? wrap(n.sub, inner, FS_SUB) : [];
      let h = 2 * PAD_Y + lines.length * LH_LABEL + (subLines.length ? subLines.length * LH_SUB + 4 : 0);
      if (n.shape === 'diamond' || n.shape === 'ellipse') h += 16;
      if (n.badge) h += 4;
      n._lines = lines; n._sub = subLines;
      return { w: w, h: Math.max(n.h || 0, Math.round(h)) };
    }

    function cellText(c) { return c == null ? '' : (typeof c === 'object' ? String(c.text == null ? '' : c.text) : String(c)); }

    // A table is the Odoo list view: header row, one row per record, optional
    // per-row tint so the record that is wrong can be pointed at directly.
    // A row is either a bare array of cells or { kind, cells } - the object form
    // is how a whole record gets tinted (the row that is wrong).
    function tableRows(t) {
      return (t.rows || []).map((r) => (Array.isArray(r)
        ? { cells: r, kind: null }
        : { cells: r.cells || [], kind: r.kind || null }));
    }

    function measureTable(t) {
      const cols = (t.columns || []).map((c) => (typeof c === 'string' ? { label: c } : Object.assign({}, c)));
      const rows = tableRows(t);
      cols.forEach((c, i) => {
        let w = textW(c.label || '', FS_CELL, true);
        rows.forEach((r) => { w = Math.max(w, textW(cellText(r.cells[i]), FS_CELL)); });
        c._w = Math.max(c.width || 0, Math.round(w + 2 * CELL_PAD));
      });
      const tw = cols.reduce((a, c) => a + c._w, 0);
      const capH = t.title ? 22 : 0;
      t._cols = cols; t._rows = rows;
      return { w: Math.max(t.w || 0, tw), h: capH + HEAD_H + rows.length * CELL_H, _capH: capH, _tw: tw };
    }

    // A screen is the Odoo form/list chrome: breadcrumb, buttons, statusbar,
    // grouped fields, and an embedded one2many list.
    function measureScreen(s) {
      const inner0 = (s.width || 660) - 2 * SCR_PAD;
      let inner = inner0;
      let tbl = null;
      if (s.table) { tbl = measureTable(s.table); inner = Math.max(inner, tbl.w); }

      let h = SCR_PAD;
      if (s.breadcrumb) h += 18;
      if ((s.buttons && s.buttons.length) || (s.statusbar && s.statusbar.length)) h += 34;
      h += 8;

      const groups = (s.groups || []).map((gr) => {
        const cols = gr.columns || 2;
        const fw = Math.floor((inner - 14 * (cols - 1)) / cols);
        const rows = Math.ceil((gr.fields || []).length / cols);
        const gh = (gr.title ? 20 : 0) + rows * FIELD_H + 10;
        return { def: gr, cols: cols, fw: fw, h: gh };
      });
      groups.forEach((g) => { h += g.h; });
      if (tbl) h += tbl.h + 10;
      if (s.footer) h += 20;
      h += SCR_PAD;

      s._groups = groups; s._tbl = tbl; s._inner = inner;
      return { w: inner + 2 * SCR_PAD, h: Math.round(h) };
    }

    function measureEl(el, wHint) {
      if (el._type === 'table') return measureTable(el);
      if (el._type === 'screen') return measureScreen(el);
      return measureNode(el, wHint);
    }

    /* --------------------------------------------------------------- layout */

    // Elements may be hand-placed (x/y, v1 specs) or grouped into frames and
    // laid out automatically. Auto-layout is the normal path: a frame is a lane,
    // its items flow down (or across with flow:"row"); frames flow across the
    // board, or into an explicit grid when they carry row/col.
    function layout(spec) {
      const els = [];
      const push = (arr, type) => (arr || []).forEach((o) => els.push(Object.assign({ _type: type }, o)));
      push(spec.nodes, 'node');
      push(spec.tables, 'table');
      push(spec.screens, 'screen');

      const byId = {};
      els.forEach((e) => { byId[e.id] = e; });

      const frames = (spec.frames || spec.groups || []).map((f) => Object.assign({}, f));
      const framed = {};
      const order = {};
      frames.forEach((f) => {
        const list = f.items || f.nodes || [];
        list.forEach((id, i) => { if (byId[id]) { framed[id] = f.id; order[id] = i; } });
      });
      els.forEach((e) => {
        if (e.frame && framed[e.id] == null) { framed[e.id] = e.frame; order[e.id] = 1e6; }
      });

      const maxBoard = spec.maxWidth || 1500;
      frames.forEach((f) => {
        const mine = els.filter((e) => framed[e.id] === f.id)
                        .sort((a, b) => (order[a.id] || 0) - (order[b.id] || 0));
        f._ids = mine.map((e) => e.id);
        const nodeW = f.nodeWidth || spec.nodeWidth || DEFAULT_NODE_W;
        const flowRow = (f.flow || 'col') === 'row';
        let cur = 0, cross = 0;
        mine.forEach((e) => {
          const m = measureEl(e, nodeW);
          e._w = m.w; e._h = m.h;
          if (flowRow) { e._ox = cur; e._oy = 0; cur += m.w + NODE_GAP; cross = Math.max(cross, m.h); }
          else { e._ox = 0; e._oy = cur; cur += m.h + NODE_GAP; cross = Math.max(cross, m.w); }
        });
        cur = Math.max(0, cur - NODE_GAP);
        f._w = (flowRow ? cur : cross) + 2 * FRAME_PAD;
        f._h = (flowRow ? cross : cur) + 2 * FRAME_PAD + (f.title ? FRAME_TITLE_H : 0);
        f._flowRow = flowRow;
        // centre narrow items in a frame widened by a big sibling
        mine.forEach((e) => {
          if (!flowRow && (f.align || spec.align) !== 'start') {
            e._ox = Math.round((f._w - 2 * FRAME_PAD - e._w) / 2);
          }
        });
      });

      // Margin notes placed above/below a frame need room, or the next band
      // lands on top of them. Reserve it before the frames are placed.
      frames.forEach((f) => { f._padA = 0; f._padB = 0; f._padL = 0; f._padR = 0; });
      (spec.annotations || spec.notes || []).forEach((an) => {
        const place = an.place || 'right';
        let f = an.atFrame ? frames.filter((x) => x.id === an.atFrame)[0] : null;
        if (!f && an.at && framed[an.at]) f = frames.filter((x) => x.id === framed[an.at])[0];
        if (!f) return;
        const size = an.size || FS_NOTE;
        const lines = wrap(an.text, an.width || 240, size);
        // Match drawAnnotation's own baseline math (box._y + box._h + 22, text
        // baseline sits size*0.0 above that) or the reserved gutter runs a few
        // px short of what actually gets painted.
        const need = lines.length * (size + 4) + size + 22;
        if (place === 'below') f._padB = Math.max(f._padB, need);
        else if (place === 'above') f._padA = Math.max(f._padA, need);
        else {
          const w = Math.max.apply(null, lines.map((l) => textW(l, size))) + 30;
          if (place === 'left') f._padL = Math.max(f._padL, w);
          else f._padR = Math.max(f._padR, w);
        }
      });

      // frame placement: explicit grid when any frame says row/col, else bands
      const grid = frames.some((f) => f.row != null || f.col != null);
      if (grid) {
        let r = 0, c = 0;
        frames.forEach((f) => {
          if (f.row == null && f.col == null) { f._r = r; f._c = c; c++; }
          else { f._r = f.row == null ? r : f.row; f._c = f.col == null ? 0 : f.col; }
          r = Math.max(r, f._r);
        });
        const colW = {}, rowH = {};
        frames.forEach((f) => {
          colW[f._c] = Math.max(colW[f._c] || 0, f._w + f._padL + f._padR);
          rowH[f._r] = Math.max(rowH[f._r] || 0, f._h + f._padA + f._padB);
        });
        const colX = {}, rowY = {};
        let x = 0;
        Object.keys(colW).map(Number).sort((a, b) => a - b).forEach((k) => { colX[k] = x; x += colW[k] + FRAME_GAP; });
        let y = 0;
        Object.keys(rowH).map(Number).sort((a, b) => a - b).forEach((k) => { rowY[k] = y; y += rowH[k] + FRAME_GAP; });
        frames.forEach((f) => { f._x = colX[f._c] + f._padL; f._y = rowY[f._r] + f._padA; });
      } else {
        const boardFlow = (spec.layout || 'columns') === 'rows' ? 'rows' : 'columns';
        let bx = 0, by = 0, bandH = 0;
        frames.forEach((f) => {
          const fullW = f._w + f._padL + f._padR;
          if (boardFlow === 'rows') { f._x = f._padL; f._y = by + f._padA; by += f._h + f._padA + f._padB + FRAME_GAP; }
          else {
            if (bx > 0 && bx + fullW > maxBoard) { bx = 0; by += bandH + FRAME_GAP; bandH = 0; }
            f._x = bx + f._padL; f._y = by + f._padA;
            bx += fullW + FRAME_GAP; bandH = Math.max(bandH, f._h + f._padA + f._padB);
          }
        });
      }

      frames.forEach((f) => {
        const top = f._y + FRAME_PAD + (f.title ? FRAME_TITLE_H : 0);
        f._ids.forEach((id) => {
          const e = byId[id];
          e._x = f._x + FRAME_PAD + e._ox;
          e._y = top + e._oy;
        });
      });

      let looseY = frames.length ? Math.max.apply(null, frames.map((f) => f._y + f._h)) + FRAME_GAP : 0;
      els.forEach((e) => {
        if (e._x != null) return;
        const m = measureEl(e, e.w);
        e._w = m.w; e._h = m.h;
        if (e.x != null && e.y != null) { e._x = e.x; e._y = e.y; }
        else { e._x = 0; e._y = looseY; looseY += e._h + NODE_GAP; }
      });

      return { elements: els, nodes: els, byId: byId, frames: frames };
    }

    /* --------------------------------------------------------------- shapes */

    function drawShape(rc, g, n, k) {
      const x = n._x, y = n._y, w = n._w, h = n._h;
      const o = {
        roughness: 1.7, bowing: 1.2, seed: seedOf(n.id),
        stroke: n.color || k.s, strokeWidth: n.emphasis ? 2.4 : 1.5,
        fill: n.fill || k.f, fillStyle: n.hatch ? 'hachure' : 'solid',
        hachureGap: 6, fillWeight: 1
      };
      const shape = n.shape || 'rect';
      let el;
      if (shape === 'ellipse') {
        el = rc.ellipse(x + w / 2, y + h / 2, w, h, o);
      } else if (shape === 'diamond') {
        el = rc.polygon([[x + w / 2, y], [x + w, y + h / 2], [x + w / 2, y + h], [x, y + h / 2]], o);
      } else if (shape === 'pill' || shape === 'round') {
        const r = shape === 'pill' ? h / 2 : Math.min(14, h / 2);
        el = rc.path(
          'M' + (x + r) + ',' + y + ' H' + (x + w - r) +
          ' A' + r + ',' + r + ' 0 0 1 ' + (x + w) + ',' + (y + r) +
          ' V' + (y + h - r) +
          ' A' + r + ',' + r + ' 0 0 1 ' + (x + w - r) + ',' + (y + h) +
          ' H' + (x + r) +
          ' A' + r + ',' + r + ' 0 0 1 ' + x + ',' + (y + h - r) +
          ' V' + (y + r) +
          ' A' + r + ',' + r + ' 0 0 1 ' + (x + r) + ',' + y + ' Z', o);
      } else if (shape === 'note') {
        const fold = 16;
        el = rc.polygon([[x, y], [x + w - fold, y], [x + w, y + fold], [x + w, y + h], [x, y + h]], o);
        g.appendChild(el);
        g.appendChild(rc.line(x + w - fold, y, x + w - fold, y + fold,
          { roughness: 1.6, seed: seedOf(n.id + 'f'), stroke: n.color || k.s }));
        g.appendChild(rc.line(x + w - fold, y + fold, x + w, y + fold,
          { roughness: 1.6, seed: seedOf(n.id + 'g'), stroke: n.color || k.s }));
        return;
      } else if (shape === 'cyl') {
        el = rc.rectangle(x, y + 8, w, h - 16, o);
        g.appendChild(el);
        g.appendChild(rc.ellipse(x + w / 2, y + 8, w, 16, o));
        g.appendChild(rc.ellipse(x + w / 2, y + h - 8, w, 16, o));
        return;
      } else {
        el = rc.rectangle(x, y, w, h, o);
      }
      g.appendChild(el);
    }

    function drawNode(rc, g, n) {
      const k = kindOf(n.kind);
      drawShape(rc, g, n, k);

      const lines = n._lines, subs = n._sub || [];
      const block = lines.length * LH_LABEL + (subs.length ? subs.length * LH_SUB + 4 : 0);
      let base = n._y + n._h / 2 - block / 2 + LH_LABEL * 0.78;
      svgLines(g, lines, n._x + n._w / 2, base, LH_LABEL,
        { size: FS_LABEL, fill: n.textColor || k.t, bold: !!n.emphasis });
      if (subs.length) {
        svgLines(g, subs, n._x + n._w / 2, base + lines.length * LH_LABEL + 4, LH_SUB,
          { size: FS_SUB, fill: n.textColor || k.t, opacity: 0.72 });
      }
      if (n.badge) {
        const bw = textW(n.badge, 11) + 14;
        const bx = n._x + n._w - bw - 6, by = n._y - 9;
        const chip = document.createElementNS(SVG_NS, 'rect');
        chip.setAttribute('x', bx); chip.setAttribute('y', by);
        chip.setAttribute('width', bw); chip.setAttribute('height', 18);
        chip.setAttribute('rx', 9);
        chip.setAttribute('fill', TH.chip);
        chip.setAttribute('stroke', k.s);
        g.appendChild(chip);
        svgText(g, n.badge, bx + bw / 2, by + 13, { size: 11, fill: k.t });
      }
    }

    function drawFrame(rc, g, f) {
      g.appendChild(rc.rectangle(f._x, f._y, f._w, f._h, {
        roughness: 2.1, bowing: 1.6, seed: seedOf('frame' + f.id),
        stroke: f.color || TH.frameStroke, strokeWidth: 1.2,
        fill: TH.frameFill, fillStyle: 'solid'
      }));
      if (f.title) {
        svgText(g, f.title, f._x + FRAME_PAD, f._y + 21,
          { size: FS_TITLE, fill: f.titleColor || TH.frameTitle, anchor: 'start', bold: true });
      }
    }

    /* ----------------------------------------------- odoo-ish list & form */

    function plainRect(g, x, y, w, h, fill, opacity, rx) {
      const r = document.createElementNS(SVG_NS, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', Math.max(0, w)); r.setAttribute('height', Math.max(0, h));
      if (rx) r.setAttribute('rx', rx);
      r.setAttribute('fill', fill);
      if (opacity != null) r.setAttribute('fill-opacity', opacity);
      g.appendChild(r);
      return r;
    }

    function drawTable(rc, g, t, ox, oy, w) {
      if (!t._cols) measureTable(t);
      const cols = t._cols, rows = t._rows;
      const capH = t.title ? 22 : 0;
      const x = ox != null ? ox : t._x, y0 = oy != null ? oy : t._y;
      const k = kindOf(t.kind || 'muted');
      const tw = w || cols.reduce((a, c) => a + c._w, 0);

      if (t.title) {
        svgText(g, t.title, x, y0 + 14, { size: FS_TITLE, fill: TH.frameTitle, anchor: 'start', bold: true });
      }
      const y = y0 + capH;
      const h = HEAD_H + rows.length * CELL_H;

      // header band, then per-row tint for the records that carry meaning
      plainRect(g, x, y, tw, HEAD_H, k.s, 0.16);
      rows.forEach((r, i) => {
        if (r.kind) plainRect(g, x, y + HEAD_H + i * CELL_H, tw, CELL_H, kindOf(r.kind).s, 0.14);
        else if (i % 2) plainRect(g, x, y + HEAD_H + i * CELL_H, tw, CELL_H, TH.ink, 0.03);
      });

      g.appendChild(rc.rectangle(x, y, tw, h, {
        roughness: 1.4, bowing: 0.8, seed: seedOf('t' + t.id), stroke: t.color || k.s, strokeWidth: 1.4
      }));
      g.appendChild(rc.line(x, y + HEAD_H, x + tw, y + HEAD_H, {
        roughness: 1.2, seed: seedOf('th' + t.id), stroke: t.color || k.s, strokeWidth: 1.2
      }));

      let cx = x;
      cols.forEach((c, ci) => {
        if (ci) g.appendChild(rc.line(cx, y, cx, y + h, {
          roughness: 1.1, seed: seedOf('tc' + t.id + ci), stroke: t.color || k.s, strokeWidth: 0.7
        }));
        const right = (c.align || 'left') === 'right';
        const tx = right ? cx + c._w - CELL_PAD : cx + CELL_PAD;
        const anc = right ? 'end' : 'start';
        svgText(g, c.label || '', tx, y + 20, { size: FS_CELL, fill: k.t, anchor: anc, bold: true });
        rows.forEach((r, ri) => {
          const cell = r.cells[ci];
          const obj = cell && typeof cell === 'object' ? cell : null;
          const ck = obj && obj.kind ? kindOf(obj.kind) : (r.kind ? kindOf(r.kind) : kindOf(t.kind || 'muted'));
          svgText(g, cellText(cell), tx, y + HEAD_H + ri * CELL_H + 18, {
            size: FS_CELL, fill: ck.t, anchor: anc, bold: !!(obj && obj.bold),
            opacity: obj && obj.dim ? 0.55 : 1
          });
        });
        cx += c._w;
      });
      // row separators last, so they sit over the tints
      rows.forEach((r, i) => {
        if (!i) return;
        g.appendChild(rc.line(x, y + HEAD_H + i * CELL_H, x + tw, y + HEAD_H + i * CELL_H, {
          roughness: 1.1, seed: seedOf('tr' + t.id + i), stroke: t.color || k.s, strokeWidth: 0.6
        }));
      });
      return capH + h;
    }

    function drawChip(rc, g, text, x, y, k, active) {
      const w = textW(text, FS_SCR) + 18;
      g.appendChild(rc.rectangle(x, y, w, 22, {
        roughness: 1.3, seed: seedOf('chip' + text + x), stroke: k.s, strokeWidth: 1.1,
        fill: active ? k.s : k.f, fillStyle: 'solid'
      }));
      svgText(g, text, x + w / 2, y + 15, { size: FS_SCR, fill: active ? TH.chip : k.t });
      return w;
    }

    function drawScreen(rc, g, s) {
      const k = kindOf(s.kind || 'base');
      const x = s._x, y = s._y, w = s._w, h = s._h;

      g.appendChild(rc.rectangle(x, y, w, h, {
        roughness: 1.5, bowing: 0.9, seed: seedOf('scr' + s.id),
        stroke: s.color || k.s, strokeWidth: 2, fill: k.f, fillStyle: 'solid'
      }));

      let cy = y + SCR_PAD;
      const left = x + SCR_PAD, inner = s._inner;

      if (s.breadcrumb) {
        svgText(g, s.breadcrumb, left, cy + 11, { size: FS_SCR, fill: TH.frameTitle, anchor: 'start' });
        cy += 18;
      }
      if ((s.buttons && s.buttons.length) || (s.statusbar && s.statusbar.length)) {
        let bx = left;
        (s.buttons || []).forEach((b) => {
          const label = typeof b === 'string' ? b : b.label;
          const bk = typeof b === 'object' && b.kind ? kindOf(b.kind) : k;
          bx += drawChip(rc, g, label, bx, cy, bk, typeof b === 'object' && b.primary) + 8;
        });
        let sx = x + w - SCR_PAD;
        (s.statusbar || []).slice().reverse().forEach((st) => {
          const label = typeof st === 'string' ? st : st.label;
          const stk = typeof st === 'object' && st.kind ? kindOf(st.kind) : kindOf('muted');
          const cw = textW(label, FS_SCR) + 18;
          drawChip(rc, g, label, sx - cw, cy, stk, typeof st === 'object' && st.active);
          sx -= cw + 6;
        });
        cy += 34;
      }
      g.appendChild(rc.line(left, cy, x + w - SCR_PAD, cy, {
        roughness: 1.4, seed: seedOf('sep' + s.id), stroke: k.s, strokeWidth: 0.8
      }));
      cy += 8;

      (s._groups || []).forEach((gr) => {
        if (gr.def.title) {
          svgText(g, gr.def.title, left, cy + 13, { size: FS_TITLE, fill: TH.frameTitle, anchor: 'start', bold: true });
          cy += 20;
        }
        (gr.def.fields || []).forEach((f, i) => {
          const c = i % gr.cols, r = Math.floor(i / gr.cols);
          const fx = left + c * (gr.fw + 14), fy = cy + r * FIELD_H;
          const labelW = Math.round(gr.fw * 0.46);
          const fk = f.kind ? kindOf(f.kind) : kindOf('muted');
          svgText(g, f.label, fx, fy + 16, { size: FS_SCR, fill: TH.frameTitle, anchor: 'start', opacity: 0.85 });
          svgText(g, String(f.value == null ? '' : f.value), fx + labelW, fy + 16,
            { size: FS_SCR, fill: fk.t, anchor: 'start', bold: !!f.emphasis });
          g.appendChild(rc.line(fx + labelW, fy + 20, fx + gr.fw, fy + 20, {
            roughness: 1.6, seed: seedOf('fu' + s.id + i), stroke: fk.s, strokeWidth: 0.6, strokeLineDash: [3, 3]
          }));
        });
        cy += Math.ceil((gr.def.fields || []).length / gr.cols) * FIELD_H + 10;
      });

      if (s._tbl) {
        drawTable(rc, g, s.table, left, cy, Math.max(s._tbl._tw, 0));
        cy += s._tbl.h + 10;
      }
      if (s.footer) {
        svgText(g, s.footer, left, cy + 12, { size: FS_SCR, fill: TH.frameTitle, anchor: 'start', opacity: 0.8 });
      }
    }

    function drawElement(rc, g, e) {
      if (e._type === 'table') drawTable(rc, g, e);
      else if (e._type === 'screen') drawScreen(rc, g, e);
      else drawNode(rc, g, e);
    }

    /* ---------------------------------------------------------------- edges */

    function anchors(a, b) {
      const ac = { x: a._x + a._w / 2, y: a._y + a._h / 2 };
      const bc = { x: b._x + b._w / 2, y: b._y + b._h / 2 };
      const dx = bc.x - ac.x, dy = bc.y - ac.y;
      // Pick the pair of facing sides, so an arrow leaves and enters where a
      // person would draw it rather than cutting through the box.
      if (Math.abs(dy) >= Math.abs(dx)) {
        return dy > 0
          ? [{ x: ac.x, y: a._y + a._h, s: 'b' }, { x: bc.x, y: b._y, s: 't' }]
          : [{ x: ac.x, y: a._y, s: 't' }, { x: bc.x, y: b._y + b._h, s: 'b' }];
      }
      return dx > 0
        ? [{ x: a._x + a._w, y: ac.y, s: 'r' }, { x: b._x, y: bc.y, s: 'l' }]
        : [{ x: a._x, y: ac.y, s: 'l' }, { x: b._x + b._w, y: bc.y, s: 'r' }];
    }

    function elbow(p, q) {
      const pts = [[p.x, p.y]];
      const vertical = p.s === 'b' || p.s === 't';
      const dx = Math.abs(q.x - p.x), dy = Math.abs(q.y - p.y);
      if (vertical && dx > 6) {
        const my = (p.y + q.y) / 2;
        pts.push([p.x, my], [q.x, my]);
      } else if (!vertical && dy > 6) {
        const mx = (p.x + q.x) / 2;
        pts.push([mx, p.y], [mx, q.y]);
      }
      pts.push([q.x, q.y]);
      return pts;
    }

    function drawArrowHead(rc, g, from, to, color, seed) {
      const ang = Math.atan2(to[1] - from[1], to[0] - from[0]);
      const L = 11, S = 0.42;
      const p1 = [to[0] - L * Math.cos(ang - S), to[1] - L * Math.sin(ang - S)];
      const p2 = [to[0] - L * Math.cos(ang + S), to[1] - L * Math.sin(ang + S)];
      g.appendChild(rc.polygon([to, p1, p2], {
        roughness: 0.9, seed: seed, stroke: color, fill: color, fillStyle: 'solid', strokeWidth: 1
      }));
    }

    function drawEdge(rc, g, e, byId, idx) {
      const a = byId[e.from || e.source], b = byId[e.to || e.target];
      if (!a || !b) return;
      const color = e.color || (e.kind ? kindOf(e.kind).s : TH.edge);
      const seed = seedOf('e' + idx + (e.from || '') + (e.to || ''));
      const [p, q] = anchors(a, b);
      const pts = elbow(p, q);
      const o = {
        roughness: 1.6, bowing: 1.1, seed: seed, stroke: color,
        strokeWidth: e.emphasis ? 2.2 : 1.5
      };
      if (e.style === 'dashed' || e.style === 'dotted') {
        o.strokeLineDash = e.style === 'dotted' ? [2, 5] : [8, 6];
      }
      for (let i = 0; i < pts.length - 1; i++) {
        g.appendChild(rc.line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], o));
      }
      if (e.arrow !== false) {
        drawArrowHead(rc, g, pts[pts.length - 2], pts[pts.length - 1], color, seed);
      }
      if (e.label) {
        const mid = pts.length > 2 ? pts[Math.floor(pts.length / 2)] : [(p.x + q.x) / 2, (p.y + q.y) / 2];
        const lines = wrap(e.label, 170, FS_EDGE);
        const w = Math.max.apply(null, lines.map((l) => textW(l, FS_EDGE))) + 12;
        const h = lines.length * 15 + 6;
        const chip = document.createElementNS(SVG_NS, 'rect');
        chip.setAttribute('x', mid[0] - w / 2); chip.setAttribute('y', mid[1] - h / 2);
        chip.setAttribute('width', w); chip.setAttribute('height', h);
        chip.setAttribute('rx', 4);
        chip.setAttribute('fill', TH.chip); chip.setAttribute('fill-opacity', '0.92');
        g.appendChild(chip);
        svgLines(g, lines, mid[0], mid[1] - h / 2 + 13, 15, { size: FS_EDGE, fill: color });
      }
    }

    /* ---------------------------------------------- annotations + legend */

    function drawAnnotation(rc, g, an, byId, frames) {
      const size = an.size || FS_NOTE;
      const lines = wrap(an.text, an.width || 240, size);
      const target = (an.at && byId[an.at]) || null;
      const frame = an.atFrame && (frames || []).filter((f) => f.id === an.atFrame)[0];
      const box = target || frame;
      // A node that owns the anchor: if 'below'/'above' would still land
      // inside that frame's own rectangle (a small/last item in a tight
      // frame), push past the frame's edge instead.
      const owner = target ? ownerFrame(target, frames) : null;
      let x = an.x, y = an.y, anchor = an.anchor;
      if (box) {
        const place = an.place || 'right';
        if (place === 'below') {
          x = box._x; y = box._y + box._h + 22; anchor = anchor || 'start';
          // clamp so the box the text actually occupies (it extends
          // upward from the baseline by size+4) never dips back above the
          // owning frame's own bottom edge
          if (owner) y = Math.max(y, owner._y + owner._h + size + 6);
        } else if (place === 'above') {
          x = box._x; y = box._y - 14 - (lines.length - 1) * (size + 4); anchor = anchor || 'start';
          if (owner) y = Math.min(y, owner._y - size - 6);
        } else if (place === 'left') { x = box._x - 16; y = box._y + box._h / 2; anchor = anchor || 'end'; }
        else { x = box._x + box._w + 16; y = box._y + box._h / 2; anchor = anchor || 'start'; }
        x = (an.x != null ? an.x : x) + (an.dx || 0);
        y = (an.y != null ? an.y : y) + (an.dy || 0);
      }
      if (x == null || y == null) return;
      const color = an.color || (an.kind ? kindOf(an.kind).s : TH.ink);
      svgLines(g, lines, x, y, size + 4,
        { size: size, fill: color, anchor: anchor || 'start', rotate: an.rotate, opacity: an.opacity != null ? an.opacity : 0.95 });
      if (an.arrowTo && byId[an.arrowTo]) {
        const t = byId[an.arrowTo];
        const tx = t._x + t._w / 2, ty = t._y + t._h / 2;
        const sx = x, sy = y + 4;
        const seed = seedOf('an' + an.text);
        g.appendChild(rc.line(sx, sy, tx, ty, { roughness: 2, bowing: 2.4, seed: seed, stroke: color, strokeLineDash: [6, 5] }));
        drawArrowHead(rc, g, [sx, sy], [tx, ty], color, seed);
      }
      if (an.underline) {
        const w = Math.max.apply(null, lines.map((l) => textW(l, size)));
        const y2 = y + (lines.length - 1) * (size + 4) + 5;
        g.appendChild(rc.line(x, y2, x + w, y2, { roughness: 2.2, bowing: 3, seed: seedOf('u' + an.text), stroke: color }));
      }
    }

    function ownerFrame(el, frames) {
      for (const f of (frames || [])) if ((f._ids || []).indexOf(el.id) !== -1) return f;
      return null;
    }

    function drawLegend(rc, g, legend, x, y) {
      let cx = x;
      legend.forEach((item, i) => {
        const k = kindOf(item.kind);
        g.appendChild(rc.rectangle(cx, y, 22, 14, {
          roughness: 1.6, seed: seedOf('lg' + i), stroke: k.s, fill: k.f, fillStyle: 'solid'
        }));
        svgText(g, item.label, cx + 28, y + 12, { size: 12, fill: TH.ink, anchor: 'start', opacity: 0.8 });
        cx += 28 + textW(item.label, 12) + 26;
      });
      return cx;
    }

    /* -------------------------------------------------------------- sketchy */

    function drawSketchy(spec) {
      const L = layout(spec);
      const svg = document.createElementNS(SVG_NS, 'svg');
      const g = document.createElementNS(SVG_NS, 'g');
      svg.appendChild(g);
      const rc = rough.svg(svg);

      L.frames.forEach((f) => drawFrame(rc, g, f));
      (spec.edges || []).forEach((e, i) => drawEdge(rc, g, e, L.byId, i));
      L.elements.forEach((e) => drawElement(rc, g, e));
      (spec.annotations || spec.notes || []).forEach((an) => drawAnnotation(rc, g, an, L.byId, L.frames));

      // bounds from what was actually laid out, so the board can never clip
      let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      const acc = (x, y, w, h) => {
        minX = Math.min(minX, x); minY = Math.min(minY, y);
        maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
      };
      L.frames.forEach((f) => acc(f._x, f._y, f._w, f._h));
      L.elements.forEach((n) => acc(n._x, n._y - (n.badge ? 12 : 0), n._w, n._h + (n.badge ? 12 : 0)));
      (spec.annotations || spec.notes || []).forEach((an) => {
        const box = (an.at && L.byId[an.at]) ||
                    (an.atFrame && L.frames.filter((f) => f.id === an.atFrame)[0]);
        const size = an.size || FS_NOTE;
        const lines = wrap(an.text, an.width || 240, size);
        const tw = Math.max.apply(null, lines.map((l) => textW(l, size)));
        const th = lines.length * (size + 4) + 10;
        let x = an.x, y = an.y;
        if (box) {
          const place = an.place || 'right';
          if (place === 'below') { x = box._x; y = box._y + box._h + 22; }
          else if (place === 'above') { x = box._x; y = box._y - 14 - (lines.length - 1) * (size + 4); }
          else if (place === 'left') { x = box._x - 16 - tw; y = box._y + box._h / 2; }
          else { x = box._x + box._w + 16; y = box._y + box._h / 2; }
          x = (an.x != null ? an.x : x) + (an.dx || 0);
          y = (an.y != null ? an.y : y) + (an.dy || 0);
        }
        if (x != null && y != null) acc(x - 4, y - size - 4, tw + 8, th);
      });
      if (minX > maxX) {
        // Nothing was laid out: say so instead of showing a blank board.
        svgText(g, '(empty note - no nodes in the spec)', 0, 0,
          { size: FS_NOTE, fill: TH.frameTitle, anchor: 'start', opacity: 0.7 });
        minX = 0; minY = -FS_NOTE; maxX = 300; maxY = 8;
      }

      if (spec.legend && spec.legend.length) {
        drawLegend(rc, g, spec.legend, minX, maxY + 22);
        maxY += 22 + 20;
      }

      const M = 24;
      const w = maxX - minX + 2 * M, h = maxY - minY + 2 * M;
      g.setAttribute('transform', 'translate(' + (M - minX) + ',' + (M - minY) + ')');
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      return { el: svg, w: w, h: h };
    }

    /* -------------------------------------------------------------- mermaid */

    function initMermaid() {
      if (!window.mermaid) return;
      mermaid.initialize({
        startOnLoad: false,
        theme: isDarkBg() ? 'dark' : 'default',
        securityLevel: 'loose',
        fontFamily: INK_FONT,
        // useMaxWidth:false is the whole point - with it on, mermaid shrinks the
        // svg to the container and a wide graph renders as an unreadable strip.
        flowchart: { useMaxWidth: false, htmlLabels: true, nodeSpacing: 55, rankSpacing: 70, curve: 'basis', padding: 16 },
        sequence: { useMaxWidth: false },
        gantt: { useMaxWidth: false },
        er: { useMaxWidth: false },
        journey: { useMaxWidth: false },
        themeVariables: { fontSize: '15px' }
      });
    }
    initMermaid();

    async function drawMermaid(spec) {
      const id = 'm' + Math.random().toString(36).slice(2);
      const { svg } = await mermaid.render(id, spec.code);
      const holder = document.createElement('div');
      holder.innerHTML = svg;
      const el = holder.querySelector('svg');
      el.removeAttribute('style');
      let w = parseFloat(el.getAttribute('width')) || 0;
      let h = parseFloat(el.getAttribute('height')) || 0;
      if (!w || !h) {
        const vb = (el.getAttribute('viewBox') || '0 0 800 600').split(/[\s,]+/).map(Number);
        w = w || vb[2]; h = h || vb[3];
      }
      el.setAttribute('width', w); el.setAttribute('height', h);
      return { el: el, w: w, h: h };
    }

    /* ------------------------------------------------------- tools + reply */

    // Everything drawn in the panel by the user (pen strokes, sticky notes,
    // question answers) goes back to Claude only through notes_feedback.json
    // - there is no live socket into whatever process is running Claude, so
    // each entry must be self-contained and durable, and the human has to
    // send Claude a fresh message (or Claude has to poll) for it to be seen.
    let mode = 'pan'; // 'pan' | 'pen' | 'note'
    let currentSpec = null;
    let answeredIds = new Set();
    let activeStroke = null;

    function toBoardCoords(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      return { x: (clientX - r.left - tx) / scale, y: (clientY - r.top - ty) / scale };
    }

    const MODE_HINTS = { pen: 'Drag on the board to draw', note: 'Click the board to drop a note' };
    function forceMode(m) {
      mode = m;
      penBtn.classList.toggle('active', mode === 'pen');
      noteBtn.classList.toggle('active', mode === 'note');
      canvas.classList.toggle('pen-mode', mode === 'pen');
      canvas.classList.toggle('note-mode', mode === 'note');
      const hint = MODE_HINTS[mode];
      modeHint.textContent = hint || '';
      modeHint.classList.toggle('show', !!hint);
    }
    function setMode(next) { forceMode(mode === next ? 'pan' : next); }
    penBtn.onclick = () => setMode('pen');
    noteBtn.onclick = () => setMode('note');

    function strokePath(color) {
      const p = document.createElementNS(SVG_NS, 'path');
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', color);
      p.setAttribute('stroke-width', '2.5');
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('stroke-linejoin', 'round');
      overlay.appendChild(p);
      return p;
    }
    function pathD(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' '); }

    const PEN_COLOR = '#e8563b';

    function drawStickyEl(x, y, text, editing) {
      const fo = document.createElementNS(SVG_NS, 'foreignObject');
      fo.setAttribute('x', x); fo.setAttribute('y', y);
      fo.setAttribute('width', 180); fo.setAttribute('height', 96);
      fo.style.pointerEvents = 'auto';
      const div = document.createElement('div');
      div.className = 'sticky-note';
      fo.appendChild(div);
      overlay.appendChild(fo);

      if (!editing) {
        const span = document.createElement('div');
        span.className = 'sticky-text';
        span.textContent = text;
        div.appendChild(span);
        return;
      }
      const ta = document.createElement('textarea');
      ta.placeholder = 'Note...';
      div.appendChild(ta);
      ta.focus();
      const commit = () => {
        const val = ta.value.trim();
        if (!val) { fo.remove(); return; }
        vscode.postMessage({ type: 'feedback', kind: 'sticky', payload: { x: x, y: y, text: val } });
        div.innerHTML = '';
        const span = document.createElement('div');
        span.className = 'sticky-text';
        span.textContent = val;
        div.appendChild(span);
      };
      ta.addEventListener('blur', commit, { once: true });
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); }
        if (e.key === 'Escape') { ta.value = ''; ta.blur(); }
      });
    }

    clearMarksBtn.onclick = () => {
      overlay.querySelectorAll('path, foreignObject').forEach((el) => el.remove());
      answeredIds = new Set();
      renderQuestions();
      vscode.postMessage({ type: 'clearFeedback' });
    };

    function renderQuestions() {
      const qs = (currentSpec && currentSpec.questions) || [];
      const unanswered = qs.filter((q) => !answeredIds.has(q.id)).length;
      qBtn.style.display = qs.length ? 'inline-block' : 'none';
      qBtn.textContent = 'Questions' + (unanswered ? ' (' + unanswered + ')' : '');
      qPanel.innerHTML = '';
      if (!qs.length) { qPanel.classList.remove('open'); return; }
      const h = document.createElement('h4');
      h.textContent = "Claude's questions";
      qPanel.appendChild(h);
      qs.forEach((q) => {
        const answered = answeredIds.has(q.id);
        const item = document.createElement('div');
        item.className = 'qitem' + (answered ? ' answered' : '');
        const qt = document.createElement('div');
        qt.className = 'qtext';
        qt.textContent = q.text;
        item.appendChild(qt);
        if (answered) {
          const b = document.createElement('div');
          b.className = 'answered-badge';
          b.textContent = 'answered - sent to Claude';
          item.appendChild(b);
        } else {
          const ta = document.createElement('textarea');
          ta.placeholder = 'Your answer...';
          const btn = document.createElement('button');
          btn.textContent = 'Send';
          const send = () => {
            const val = ta.value.trim();
            if (!val) return;
            answeredIds.add(q.id);
            vscode.postMessage({ type: 'feedback', kind: 'answer', payload: { questionId: q.id, question: q.text, text: val } });
            renderQuestions();
          };
          btn.onclick = send;
          ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(); });
          item.appendChild(ta);
          item.appendChild(btn);
        }
        qPanel.appendChild(item);
      });
    }
    qBtn.onclick = () => qPanel.classList.toggle('open');

    function restoreFeedback(data) {
      overlay.querySelectorAll('path, foreignObject').forEach((el) => el.remove());
      answeredIds = new Set((data.answers || []).map((a) => a.questionId));
      (data.drawings || []).forEach((d) => {
        const p = strokePath(d.color || PEN_COLOR);
        p.setAttribute('d', pathD(d.points || []));
      });
      (data.stickies || []).forEach((s) => drawStickyEl(s.x, s.y, s.text, false));
      renderQuestions();
    }

    /* -------------------------------------------------------------- library */

    // The library is a persistent per-project archive (.claude/notes/*.json),
    // separate from the scratch notes.json the board is normally rendered
    // from - saved boards stick around for the user to reopen in any future
    // session, not just re-rendered on the next write.
    let libraryItems = [];
    let viewingSaved = null; // { file, title } while showing a saved snapshot

    saveBtn.onclick = () => vscode.postMessage({ type: 'saveBoard' });
    libraryBtn.onclick = () => {
      vscode.postMessage({ type: 'listLibrary' });
      libraryPanel.classList.toggle('open');
    };

    function renderLibrary() {
      libraryPanel.innerHTML = '';
      const h = document.createElement('h4');
      h.textContent = 'Saved notes';
      libraryPanel.appendChild(h);
      if (!libraryItems.length) {
        const p = document.createElement('div');
        p.className = 'libempty';
        p.textContent = 'Nothing saved yet - use Save to keep this board here.';
        libraryPanel.appendChild(p);
        return;
      }
      libraryItems.forEach((it) => {
        const row = document.createElement('div');
        row.className = 'libitem';
        const t = document.createElement('div');
        t.className = 'libtitle';
        t.textContent = it.title;
        const d = document.createElement('div');
        d.className = 'libdate';
        d.textContent = new Date(it.savedAt).toLocaleString();
        const actions = document.createElement('div');
        actions.className = 'libactions';
        const viewBtn = document.createElement('button');
        viewBtn.textContent = 'View';
        viewBtn.onclick = () => {
          vscode.postMessage({ type: 'loadFromLibrary', file: it.file });
          libraryPanel.classList.remove('open');
        };
        const mentionBtn = document.createElement('button');
        mentionBtn.textContent = 'Copy mention';
        mentionBtn.onclick = () => vscode.postMessage({ type: 'copyMention', file: it.file, title: it.title });
        actions.appendChild(viewBtn);
        actions.appendChild(mentionBtn);
        row.appendChild(t); row.appendChild(d); row.appendChild(actions);
        libraryPanel.appendChild(row);
      });
    }

    function showViewBanner(file, title) {
      viewingSaved = { file: file, title: title };
      forceMode('pan');
      penBtn.disabled = true; noteBtn.disabled = true;
      viewBanner.innerHTML = '';
      viewBanner.classList.add('show');
      const label = document.createElement('span');
      label.textContent = 'Viewing saved: ' + (title || file);
      const resumeBtn = document.createElement('button');
      resumeBtn.textContent = 'Resume editing';
      resumeBtn.onclick = () => vscode.postMessage({ type: 'resumeLive', file: file });
      const liveBtn = document.createElement('button');
      liveBtn.textContent = 'Back to live';
      liveBtn.onclick = () => vscode.postMessage({ type: 'backToLive' });
      viewBanner.appendChild(label);
      viewBanner.appendChild(resumeBtn);
      viewBanner.appendChild(liveBtn);
    }
    function hideViewBanner() {
      viewingSaved = null;
      penBtn.disabled = false; noteBtn.disabled = false;
      viewBanner.classList.remove('show');
      viewBanner.innerHTML = '';
    }
    function showLiveUpdatedBanner() {
      if (!viewingSaved || viewBanner.querySelector('.live-update-btn')) return;
      const b = document.createElement('button');
      b.className = 'live-update-btn';
      b.textContent = 'Live board updated - View';
      b.onclick = () => vscode.postMessage({ type: 'backToLive' });
      viewBanner.appendChild(b);
    }

    /* ------------------------------------------------------------ pan/zoom */

    let scale = 1, tx = 0, ty = 0, content = { w: 1, h: 1 };

    function applyTransform() {
      viewport.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
      zoomLabel.textContent = Math.round(scale * 100) + '%';
    }
    function fit() {
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      if (!content.w || !content.h) return;
      // 1.5 rather than 3: a two-box sketch blown up to fill a wide panel reads
      // as broken, not as emphasis.
      scale = Math.min(cw / content.w, ch / content.h, 1.5);
      if (!isFinite(scale) || scale <= 0) scale = 1;
      tx = (cw - content.w * scale) / 2;
      ty = Math.max(8, (ch - content.h * scale) / 2);
      applyTransform();
    }
    function zoomAt(factor, cx, cy) {
      const next = Math.min(6, Math.max(0.08, scale * factor));
      tx = cx - (cx - tx) * (next / scale);
      ty = cy - (cy - ty) * (next / scale);
      scale = next; applyTransform();
    }

    document.getElementById('fit').onclick = fit;
    document.getElementById('zin').onclick = () => zoomAt(1.2, canvas.clientWidth / 2, canvas.clientHeight / 2);
    document.getElementById('zout').onclick = () => zoomAt(1 / 1.2, canvas.clientWidth / 2, canvas.clientHeight / 2);
    document.getElementById('reset').onclick = () => { scale = 1; tx = 8; ty = 8; applyTransform(); };

    canvas.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      const r = canvas.getBoundingClientRect();
      zoomAt(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX - r.left, ev.clientY - r.top);
    }, { passive: false });

    let drag = null;
    canvas.addEventListener('pointerdown', (ev) => {
      if (mode === 'pen') {
        canvas.setPointerCapture(ev.pointerId);
        const b = toBoardCoords(ev.clientX, ev.clientY);
        const path = strokePath(PEN_COLOR);
        activeStroke = { path: path, pts: [[b.x, b.y]] };
        path.setAttribute('d', pathD(activeStroke.pts));
        return;
      }
      if (mode === 'note') {
        const b = toBoardCoords(ev.clientX, ev.clientY);
        drawStickyEl(b.x, b.y, '', true);
        return;
      }
      drag = { x: ev.clientX, y: ev.clientY, tx: tx, ty: ty };
      canvas.classList.add('dragging');
      canvas.setPointerCapture(ev.pointerId);
    });
    canvas.addEventListener('pointermove', (ev) => {
      if (mode === 'pen' && activeStroke) {
        const b = toBoardCoords(ev.clientX, ev.clientY);
        activeStroke.pts.push([b.x, b.y]);
        activeStroke.path.setAttribute('d', pathD(activeStroke.pts));
        return;
      }
      if (!drag) return;
      tx = drag.tx + (ev.clientX - drag.x);
      ty = drag.ty + (ev.clientY - drag.y);
      applyTransform();
    });
    const endDrag = () => {
      if (mode === 'pen' && activeStroke) {
        if (activeStroke.pts.length > 1) {
          vscode.postMessage({ type: 'feedback', kind: 'drawing', payload: { color: PEN_COLOR, points: activeStroke.pts } });
        } else {
          activeStroke.path.remove(); // a click with no drag - nothing to keep
        }
        activeStroke = null;
      }
      drag = null; canvas.classList.remove('dragging');
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('dblclick', () => { if (mode === 'pan') fit(); });
    window.addEventListener('resize', () => { if (autoFit) fit(); });

    /* --------------------------------------------------------------- render */

    let autoFit = true;
    let firstRenderDone = false;
    let lastTitle = null;

    function showError(message) {
      emptyEl.style.display = 'none';
      boardContent.innerHTML = '';
      const d = document.createElement('div');
      d.id = 'err';
      d.textContent = 'Notes error: ' + message;
      boardContent.appendChild(d);
      scale = 1; tx = 0; ty = 0; applyTransform();
    }

    async function renderSpec(spec, viewingSavedFile) {
      TH = THEMES[isDarkBg() ? 'dark' : 'light'];
      emptyEl.style.display = 'none';
      titleEl.textContent = spec.title || 'Claude Notes';
      currentSpec = spec;
      if (viewingSavedFile) showViewBanner(viewingSavedFile, spec.title); else hideViewBanner();
      boardContent.innerHTML = '';
      try {
        const out = (spec.style === 'mermaid')
          ? await drawMermaid(spec)
          : drawSketchy(spec);
        boardContent.appendChild(out.el);
        content = { w: out.w, h: out.h };
        // Live/incremental updates rewrite the same board repeatedly while
        // Claude is still composing it - re-fitting on every single write
        // would yank the view out from under anyone watching it build or
        // who has since panned/zoomed in. Only snap to fit for a genuinely
        // new board (title change, or the very first render).
        const isNewBoard = !firstRenderDone || spec.title !== lastTitle;
        firstRenderDone = true;
        lastTitle = spec.title;
        if (isNewBoard) { autoFit = true; fit(); }
        renderQuestions();
      } catch (e) {
        showError((e && e.message) || String(e));
      }
    }

    // Tell the extension host the listener is live. Posting a render message
    // right after webview.html is set can race this script's own load/parse -
    // that message is silently dropped with no error on either side, and the
    // panel is stuck on "No notes yet" until something else touches the file.
    vscode.postMessage({ type: 'ready' });

    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg.type === 'clear') {
        boardContent.innerHTML = ''; emptyEl.style.display = 'block';
        titleEl.textContent = 'Claude Notes';
        currentSpec = null; firstRenderDone = false; lastTitle = null;
        overlay.querySelectorAll('path, foreignObject').forEach((el) => el.remove());
        answeredIds = new Set();
        hideViewBanner();
        renderQuestions();
        return;
      }
      if (msg.type === 'error') { showError(msg.message); return; }
      if (msg.type === 'render') { renderSpec(msg.spec, msg.viewingSaved); return; }
      if (msg.type === 'feedbackState') { restoreFeedback(msg.data || {}); return; }
      if (msg.type === 'library') { libraryItems = msg.items || []; renderLibrary(); return; }
      if (msg.type === 'liveUpdated') { showLiveUpdatedBanner(); return; }
    });
  })();
  </script>
</body>
</html>
