name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      pre_release:
        description: 'Publish as a pre-release (Marketplace only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # @vscode/vsce 4.x requires Node >= 22. This is the BUILD runtime;
          # the emitted bundle targets node18, which is what VS Code 1.85
          # (engines.vscode) actually ships.
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check-types     # esbuild strips types without checking them
      - run: npm run lint
      - run: npm run test:unit
      # VS Code is Electron: on ubuntu-24.04 runners the image no longer ships
      # several libraries it dlopen()s at startup, so `xvfb-run npm test` dies
      # before a single test runs. xvfb alone is not enough.
      - name: System libraries VS Code needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libgtk-3-0t64 libpango-1.0-0 libcairo2
      - run: xvfb-run -a npm test    # integration tests drive a real VS Code

      - id: pack
        run: |
          set -euo pipefail
          # Derived, never spelled out: the hardcoded name survived the
          # rename to agent-board and would have packaged under the old one.
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PRE=""
          if [ "${{ inputs.pre_release }}" = "true" ]; then PRE="--pre-release"; fi
          npx --yes @vscode/vsce@4 package $PRE --no-dependencies -o "${NAME}-${VERSION}.vsix"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "$GITHUB_OUTPUT"

      # `vsce ls` does NOT detect a missing entrypoint (verified: it exits 0
      # and just lists files). `vsce package` above does, but assert it
      # explicitly so a mis-ignored dist/ names itself instead of surfacing
      # later as a broken install.
      - name: Verify the bundle is actually in the VSIX
        run: |
          set -euo pipefail
          unzip -l "${{ steps.pack.outputs.vsix }}" | grep -q 'extension/dist/extension.js'
          unzip -l "${{ steps.pack.outputs.vsix }}" | grep -q 'extension/dist/webview.js'
          echo "entrypoints present"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.pack.outputs.vsix }}
          if-no-files-found: error

  publish-marketplace:
    needs: build
    # Trusted publishing has to be set up on the Marketplace publisher before
    # this can work. Until then an unguarded run just fails the tag. Flip the
    # repo variable PUBLISH_REGISTRIES to "true" once the policy exists.
    if: vars.PUBLISH_REGISTRIES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # MANDATORY, and it must be on the JOB. vsce deliberately does NOT fall
      # back to a PAT when token exchange fails.
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: vsix }
      # Azure DevOps global PATs retire 2026-12-01; this is the OIDC path.
      - run: npx --yes @vscode/vsce@4 publish --oidc --packagePath "${{ needs.build.outputs.vsix }}" --skip-duplicate

  publish-openvsx:
    needs: build
    if: vars.PUBLISH_REGISTRIES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: vsix }
      # NOTE: do NOT define an OVSX_PAT secret. ovsx documents that a PAT
      # always takes precedence, so a leftover one silently defeats OIDC.
      - run: npx --yes ovsx@1 publish "${{ needs.build.outputs.vsix }}" --trusted-publishing
        env:
          OVSX_TIMEOUT: '120000'

  # The GitHub Release is what people actually download from while the
  # Marketplace listing does not exist yet. It needs no secret: Actions issues
  # GITHUB_TOKEN automatically, and `contents: write` is what lets it publish.
  # The GitHub Release is what people download from while there is no
  # Marketplace listing. It needs no secret: Actions issues GITHUB_TOKEN
  # automatically, and `contents: write` is what lets it publish.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist-vsix

      # v1.1.0 published a Release with NO asset attached and still reported
      # success, so the failure was invisible until someone clicked Download.
      # Find the file ourselves instead of trusting a passed-through output,
      # and refuse to continue if it is not there.
      - name: Locate the VSIX
        id: find
        run: |
          set -euo pipefail
          ls -la dist-vsix || true
          VSIX="$(find dist-vsix -name '*.vsix' -type f | head -1)"
          if [ -z "$VSIX" ]; then
            echo "::error::no .vsix in the build artifact — nothing to attach"
            exit 1
          fi
          echo "found $VSIX ($(stat -c%s "$VSIX") bytes)"
          echo "path=$VSIX" >> "$GITHUB_OUTPUT"

      # The skill is the other half of the product — without it the agent
      # never writes a board. Shipping only the .vsix meant cloning the repo
      # to get it. The zip keeps the `visual-notes/` directory name, because
      # that name is the path the agent looks under.
      - name: Package the skill
        run: |
          set -euo pipefail
          rm -rf skillpkg && mkdir -p skillpkg/visual-notes
          cp skill/SKILL.md skillpkg/visual-notes/SKILL.md
          (cd skillpkg && zip -qr ../visual-notes-skill.zip visual-notes)
          cp skill/SKILL.md ./SKILL.md
          ls -la visual-notes-skill.zip SKILL.md

      - name: Publish the Release with the VSIX and the skill attached
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ steps.find.outputs.path }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' \
            "**1. The extension.** Download \`agent-board-$VERSION.vsix\` below, then in VS Code run **Extensions: Install from VSIX...** from the command palette." \
            "" \
            "**2. The skill.** Download \`visual-notes-skill.zip\` and unzip it into your agent's skills directory, so you end up with:" \
            "" \
            "    ~/.claude/skills/visual-notes/SKILL.md" \
            "" \
            "(For Claude Code that path is picked up automatically. For another agent, point it at SKILL.md however that agent takes instructions.)" \
            "" \
            "Both halves are needed: the extension renders the board, the skill is what teaches the agent to write one." \
            "" \
            "MIT licensed. No telemetry." > notes.md

          # Re-runnable: a re-pushed tag must update the existing Release
          # rather than fail on "already exists" and leave it half-populated.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Agent Board $VERSION" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" "$VSIX" visual-notes-skill.zip SKILL.md \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" visual-notes-skill.zip SKILL.md \
              --repo "$GITHUB_REPOSITORY" \
              --title "Agent Board $VERSION" \
              --notes-file notes.md
          fi

      - name: Verify the asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAMES="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "assets on the release: ${NAMES:-<none>}"
          echo "$NAMES" | grep -q '\.vsix$'            || { echo "::error::Release has no .vsix attached"; exit 1; }
          echo "$NAMES" | grep -q 'visual-notes-skill\.zip' || { echo "::error::Release has no skill zip attached"; exit 1; }
          echo "$NAMES" | grep -qx 'SKILL.md'           || { echo "::error::Release has no SKILL.md attached"; exit 1; }
